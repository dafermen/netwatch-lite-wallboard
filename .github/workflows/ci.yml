name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  validate:
    name: Build, test, and validate portable output
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Validate documentation
        shell: powershell
        run: .\scripts\validate-docs.ps1

      - name: Restore
        run: dotnet restore .\src\NetWatchLite.Wallboard.WebView2\NetWatchLite.Wallboard.WebView2.csproj

      - name: Build release
        run: dotnet build .\src\NetWatchLite.Wallboard.WebView2\NetWatchLite.Wallboard.WebView2.csproj -c Release --no-restore

      - name: Run test projects
        shell: powershell
        run: |
          $testProjects = Get-ChildItem .\tests -Recurse -Filter "*.csproj" -ErrorAction SilentlyContinue
          if (-not $testProjects) {
            Write-Host "No automated test project exists yet. See docs/TESTING.md."
          }

          foreach ($testProject in $testProjects) {
            dotnet test $testProject.FullName -c Release
            if ($LASTEXITCODE -ne 0) {
              throw "Tests failed: $($testProject.FullName)"
            }
          }

      - name: Review vulnerable packages
        shell: powershell
        run: |
          $auditOutput = dotnet list .\src\NetWatchLite.Wallboard.WebView2\NetWatchLite.Wallboard.WebView2.csproj package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Host $auditOutput

          if ($LASTEXITCODE -ne 0) {
            throw "NuGet vulnerability review could not be completed."
          }

          if ($auditOutput -match "has the following vulnerable packages") {
            throw "A vulnerable NuGet package was reported."
          }

      - name: Validate latest patch formatting
        run: git diff --check HEAD^ HEAD

      - name: Publish portable folder
        shell: powershell
        run: .\scripts\publish-portable.ps1 -NoZip

      - name: Validate portable contents
        shell: powershell
        run: |
          $portableFolder = Get-ChildItem .\publish -Directory | Select-Object -First 1
          if (-not $portableFolder) {
            throw "Portable output folder was not created."
          }

          $requiredFiles = @(
            "NetWatch-Lite-Wallboard.exe",
            "wallboard.json",
            "wallboard.demo.json",
            "wallboard.production.json",
            "README.md",
            "LICENSE"
          )

          foreach ($requiredFile in $requiredFiles) {
            if (-not (Test-Path (Join-Path $portableFolder.FullName $requiredFile))) {
              throw "Portable output is missing $requiredFile."
            }
          }

          if (Get-ChildItem $portableFolder.FullName -Recurse -Filter "wallboard.backup.json") {
            throw "Portable output contains wallboard.backup.json."
          }

      - name: Upload portable validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: netwatch-lite-wallboard-portable
          path: publish/NetWatch-Lite-Wallboard-WebView2-*
          if-no-files-found: error
          retention-days: 7
