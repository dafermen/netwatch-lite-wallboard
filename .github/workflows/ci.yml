name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  validate:
    name: Build, test, and validate portable output
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Validate documentation
        shell: powershell
        run: .\scripts\validate-docs.ps1

      - name: Restore
        run: dotnet restore .\netwatch-lite-wallboard.slnx

      - name: Build release
        run: dotnet build .\netwatch-lite-wallboard.slnx -c Release --no-restore

      - name: Run test projects
        run: dotnet test .\netwatch-lite-wallboard.slnx -c Release --no-build --no-restore --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: warn

      - name: Review vulnerable packages
        shell: powershell
        run: |
          $auditOutput = dotnet list .\netwatch-lite-wallboard.slnx package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Host $auditOutput

          if ($LASTEXITCODE -ne 0) {
            throw "NuGet vulnerability review could not be completed."
          }

          if ($auditOutput -match "has the following vulnerable packages") {
            throw "A vulnerable NuGet package was reported."
          }

      - name: Validate latest patch formatting
        run: git diff --check HEAD^ HEAD

      - name: Publish and test self-contained portable ZIP
        shell: powershell
        run: .\scripts\publish-portable.ps1

      - name: Upload package test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portable-test-results
          path: |
            artifacts/verification/**/*.json
            artifacts/verification/*/integrity-*.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Upload portable validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: netwatch-lite-wallboard-portable
          path: artifacts/packages/*
          if-no-files-found: error
          retention-days: 7
