name: Deep Logic Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Property and bounded fuzz regression tests
        run: dotnet test .\netwatch-lite-wallboard.slnx -c Release --logger trx --results-directory TestResults
      - name: Mutation baseline for recovery and memory protection
        shell: powershell
        run: .\scripts\test-mutation.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: deep-test-evidence
          path: TestResults/
          retention-days: 7
