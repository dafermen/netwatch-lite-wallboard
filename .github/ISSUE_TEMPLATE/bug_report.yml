name: Bug report
description: Report a reproducible problem in NetWatch Lite Wallboard.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private URLs, tokens, or sensitive logs.
  - type: input
    id: version
    attributes:
      label: Application version
      placeholder: 0.3.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 23H2
    validations:
      required: true
  - type: input
    id: webview
    attributes:
      label: WebView2 Runtime version
    validations:
      required: false
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Start the app...
        2. Open...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Include uptime, layout, memory measurements, and relevant log lines without secrets.
    validations:
      required: false
  - type: checkboxes
    id: safety
    attributes:
      label: Sensitive data check
      options:
        - label: I removed credentials, tokens, private URLs, cookies, and other sensitive data.
          required: true
